apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qoves-api
  namespace: qoves
  labels:
    app: qoves-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: qoves.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qoves-api
                port:
                  name: http
