apiVersion: apps/v1
kind: Deployment
metadata:
  name: qoves-api
  namespace: qoves
  labels:
    app: qoves-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qoves-api
  template:
    metadata:
      labels:
        app: qoves-api
    spec:
      containers:
        - name: api
          image: qoves-api:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: qoves-db-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
